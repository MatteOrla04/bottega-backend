<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagrafica Iscritti - Bottega Solidale</title>
    <link rel="stylesheet" href="style.css?v=6">

    <script>
        if (!sessionStorage.getItem("operatoreLoggato")) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body>

    <header class="top-bar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">
            ⬅️ Dashboard
        </div>
    </header>

    <main style="padding: 3rem;">
        <div class="pos-box" style="max-width: 1000px; margin: 0 auto;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Storico Anagrafico</h2>
                <div>
                    <input type="text" id="input-ricerca-iscritti" placeholder="Cerca per nome, tessera, città..." onkeyup="filtraIscritti()" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc; width: 300px;">
                    <button class="btn-conferma" onclick="filtraIscritti()" style="width: auto; padding: 10px 15px; margin-top: 0; margin-left: 10px;">Filtra</button>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Tessera</th>
                        <th>Nome</th>
                        <th>Cognome</th>
                        <th>Saldo Punti</th>
                        <th>Azione</th>
                    </tr>
                </thead>
                <tbody id="tabella-tutti-iscritti">
                    <!-- Le righe verranno riempite da JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODALE: Dettagli Utente (Storico Anagrafica) -->
    <div id="modal-dettagli-utente" class="modal">
        <div class="modal-content" style="max-width: 500px; text-align: left;">
            <span class="close-btn" onclick="chiudiModale('modal-dettagli-utente')">&times;</span>
            <h2 style="text-align: center; color: #007aff;">Scheda Iscritto</h2>
            
            <!-- Qui Javascript inietterà tutti i dati anagrafici e lo storico -->
            <div id="dettagli-contenuto"></div>

            <!-- IL BOTTONE DEL DOCUMENTO (Appare solo se c'è foto) -->
            <div id="area-documento" style="margin: 15px 0; display: none; text-align: center;">
                <button id="btn-vedi-documento-anagrafica" style="padding: 10px; width: 100%; background-color: #f39c12; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px; font-size: 14px;" onclick="mostraDocumentoAnagrafica()">
                     Verifica Documento
                </button>
                <button id="btn-elimina-doc-db" style="padding: 10px; width: 100%; font-size: 14px; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; background: #dc3545; color: white;" onclick="eliminaDocumentoDb()">
                     Elimina Documenti
                </button>
            </div>

            <div style="border-top: 1px solid #ddd; padding-top: 15px; text-align: center;">
                <button onclick="eseguiRicarica()" class="btn-green" style="width: 100%; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px;">
                    + AGGIUNGI PUNTI
                </button>
            </div>
        </div>
    </div>

    <!-- MODALE: Visualizzatore Documento ( IN PRIMO PIANO) -->
    <div id="modal-documento-pos" class="modal" style="z-index: 9999;">
        <div class="modal-content" style="max-width: 500px; text-align: center;">
            <span class="close-btn" onclick="chiudiModale('modal-documento-pos');">&times;</span>
            <h2 style="color: #007aff; margin-bottom: 15px;">Verifica Identità</h2>
            <div id="contenitore-doc-pos" style="display: flex; flex-direction: column; gap: 10px; align-items: center; max-height: 60vh; overflow-y: auto;">
                <!-- Le foto appaiono qui -->
            </div>
        </div>
    </div>

    <!-- INIZIO JAVASCRIPT -->
    <script>
        let listaIscritti = []; 
        let utenteSelezionato = null; 

        window.onload = function() {
            caricaIscritti();
        };

        function caricaIscritti() {
            fetch('/api/cassa/beneficiari')
                .then(response => response.json())
                .then(dati => {
                    listaIscritti = dati; 
                    disegnaTabella(listaIscritti); 
                })
                .catch(errore => console.error("Errore nel caricamento dati:", errore));
        }

        function filtraIscritti() {
            const termineRicerca = document.getElementById('input-ricerca-iscritti').value.toLowerCase();
            const risultatiFiltrati = listaIscritti.filter(cliente => {
                const datiCompleti = Object.values(cliente).map(val => val ? val.toString().toLowerCase() : "").join(" ");
                return datiCompleti.includes(termineRicerca);
            });
            disegnaTabella(risultatiFiltrati);
        }

        function disegnaTabella(listaDaMostrare) {
            const tbody = document.getElementById('tabella-tutti-iscritti');
            tbody.innerHTML = '';
            
            listaDaMostrare.forEach(cliente => {
                const indiceOriginale = listaIscritti.indexOf(cliente);
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${cliente.codiceTessera}</strong></td>
                    <td>${cliente.nome}</td>
                    <td>${cliente.cognome}</td>
                    <td style="color: var(--green-accent); font-weight: bold; font-size: 1.1em;">${cliente.saldoPunti}</td>
                    <td>
                        <button onclick="mostraDettagli(${indiceOriginale})" style="padding: 6px 12px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px;">Dettagli</button>
                        <button onclick="eliminaUtente('${cliente.codiceTessera}')" style="padding: 6px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;"> Elimina</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function eliminaUtente(tessera) {
            if(confirm("Sei sicuro di voler eliminare l'utente con tessera " + tessera + "? L'operazione è irreversibile!")) {
                fetch('/api/cassa/beneficiario/' + tessera, { method: 'DELETE' })
                .then(response => {
                    if(response.ok) {
                        alert("Utente eliminato!");
                        caricaIscritti(); 
                    } else {
                        alert("Errore durante l'eliminazione.");
                    }
                })
                .catch(errore => console.error("Errore di rete:", errore));
            }
        }

        // --- LA FUNZIONE CHE COSTRUISCE LA FINESTRA DETTAGLI ---
        function mostraDettagli(indice) {
            const cliente = listaIscritti[indice];
            utenteSelezionato = cliente; 
            
            const contenitore = document.getElementById('dettagli-contenuto');
            
            // 1. Compilo i dati anagrafici
            contenitore.innerHTML = `
                <p><strong>Tessera:</strong> <span style="color:var(--primary-color); font-weight:bold;">${cliente.codiceTessera}</span></p>
                <p><strong>Nome e Cognome:</strong> ${cliente.nome} ${cliente.cognome}</p>
                <p><strong>Telefono:</strong> ${cliente.telefono || "N/A"}</p>
                <p><strong>Residenza:</strong> ${cliente.indirizzo_abitazione || "N/A"} ${cliente.numero_civico || ""}, ${cliente.citta || "N/A"} (${cliente.provincia || "N/A"})</p>
                <p><strong>Cittadinanza:</strong> ${cliente.cittadinanza || "N/A"}</p>
                <p><strong>Nucleo Familiare:</strong> ${cliente.numeroNucleoFamiliare || 0} componenti</p>
                <p><strong>Valore ISEE:</strong> € ${cliente.valoreIsee || "0,00"}</p>
                
                <div style="background-color: #f4f4f9; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center;">
                    <p style="margin: 0; font-size: 0.9em;">Saldo Punti Attuale:</p>
                    <h1 style="color: var(--green-accent); margin: 5px 0; font-size: 2.5em;">${cliente.saldoPunti}</h1>
                </div>

                <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ccc;">
                <h4 style="margin-bottom: 10px;">Storico Acquisti</h4>
                
                <div id="tabella-storico" style="max-height: 200px; overflow-y: auto; font-size: 0.9em;">
                    <p>Caricamento storico in corso...</p>
                </div>
            `;
            
           // 2. Accendo i bottoni del documento SE c'è un'immagine salvata
const areaDoc = document.getElementById('area-documento');
if (cliente.documentoBase64 && 
    cliente.documentoBase64 !== "null" && 
    cliente.documentoBase64 !== "[]" && 
    String(cliente.documentoBase64).trim() !== "") {
    
    areaDoc.style.display = 'block'; 
} else {
    areaDoc.style.display = 'none';
}

            // 3. Apro la modale
            document.getElementById('modal-dettagli-utente').style.display = 'block';

            // 4. Carico lo storico acquisti
            fetch('/api/cassa/beneficiario/storico?tessera=' + cliente.codiceTessera)
                .then(response => response.json())
                .then(storico => {
                    const divStorico = document.getElementById('tabella-storico');
                    
                    if (storico.length === 0) {
                        divStorico.innerHTML = "<p style='color: #666; font-style: italic;'>Nessun acquisto registrato.</p>";
                        return;
                    }

                    let tabellaHTML = `
                        <table style="width: 100%; border-collapse: collapse; text-align: left;">
                            <thead>
                                <tr style="background-color: #eee;">
                                    <th style="padding: 5px; border-bottom: 2px solid #ccc;">Data e Ora</th>
                                    <th style="padding: 5px; border-bottom: 2px solid #ccc;">Articolo</th>
                                    <th style="padding: 5px; border-bottom: 2px solid #ccc;">Q.tà</th>
                                    <th style="padding: 5px; border-bottom: 2px solid #ccc;">Punti</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    storico.forEach(acquisto => {
                        let dataFormattata = "Data non disp.";
                        if (acquisto.dataOperazione) {
                            let dataSicura = acquisto.dataOperazione.replace(" ", "T");
                            dataFormattata = new Date(dataSicura).toLocaleString('it-IT', {
                                day: '2-digit', month: '2-digit', year: 'numeric', 
                                hour: '2-digit', minute:'2-digit'
                            });
                        }

                        tabellaHTML += `
                            <tr style="border-bottom: 1px solid #eee;">
                                <td style="padding: 5px; font-size: 0.85em; color: #555;">${dataFormattata}</td>
                                <td style="padding: 5px;">${acquisto.codiceBarre}</td>
                                <td style="padding: 5px;"><strong>${acquisto.quantita}</strong></td>
                                <td style="padding: 5px; color: #dc3545; font-weight: bold;">-${acquisto.puntiSpesi}</td>
                            </tr>
                        `;
                    });

                    tabellaHTML += `</tbody></table>`;
                    divStorico.innerHTML = tabellaHTML;
                })
                .catch(errore => {
                    document.getElementById('tabella-storico').innerHTML = "<p style='color: red;'>Errore nel caricamento. Riprova.</p>";
                });
        }

      // --- MOTORE CHE APRE LA FOTO DEL DOCUMENTO ---
      function mostraDocumentoAnagrafica() {
            if (!utenteSelezionato || !utenteSelezionato.documentoBase64) return;
            
            const contenitore = document.getElementById('contenitore-doc-pos');
            contenitore.innerHTML = "";
            
            let stringaBase64 = utenteSelezionato.documentoBase64;
            let arrayImmagini = [];
            if (stringaBase64.startsWith('[')) {
                arrayImmagini = JSON.parse(stringaBase64); 
            } else {
                arrayImmagini = [stringaBase64];
            }

            arrayImmagini.forEach(imgBase64 => {
                let img = document.createElement('img');
                img.src = imgBase64;
                img.style = "max-width: 100%; border-radius: 8px; border: 1px solid #ccc; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 10px;";
                contenitore.appendChild(img);
            });
            
            // LA SOLUZIONE DEFINITIVA ALLA GUERRA TRA FINESTRE:
            // 1. Spingiamo "sotto" la finestra dell'anagrafica
            document.getElementById('modal-dettagli-utente').style.zIndex = "1000";
            
            // 2. Tiriamo "sopra" al massimo livello la finestra della foto
            let modaleFoto = document.getElementById('modal-documento-pos');
            modaleFoto.style.zIndex = "99999";
            modaleFoto.style.display = 'block';
        }
        function eliminaDocumentoDb() {
            if (!utenteSelezionato) return;
            
            if (confirm("Sei sicuro di voler eliminare tutte le immagini associate a " + utenteSelezionato.nome + " dal database? L'operazione non può essere annullata.")) {
                fetch(`/api/cassa/beneficiario/documento?tessera=${utenteSelezionato.codiceTessera}`, { method: 'DELETE' })
                .then(async response => {
                    const testo = await response.text();
                    if (!response.ok) throw new Error(testo);
                    
                    alert("✅ " + testo);
                    // Nascondiamo i bottoni senza ricaricare
                    document.getElementById('area-documento').style.display = 'none';
                    utenteSelezionato.documentoBase64 = null; 
                })
                .catch(errore => alert("❌ " + errore.message));
            }
        }

        function chiudiModale(idModale) {
            document.getElementById(idModale).style.display = 'none';
        }

        function eseguiRicarica() {
            if (!utenteSelezionato) return;
            let punti = prompt("Quanti punti vuoi aggiungere alla tessera di " + utenteSelezionato.nome + "?");
            if (!punti || isNaN(punti) || parseInt(punti) <= 0) return;
            
            fetch(`/api/cassa/beneficiario/ricarica?tessera=${utenteSelezionato.codiceTessera}&puntiAggiuntivi=${parseInt(punti)}`, { method: 'POST' })
            .then(async response => {
                const testoRisposta = await response.text();
                if (!response.ok) throw new Error(testoRisposta);
                alert("✅ " + testoRisposta);
                chiudiModale('modal-dettagli-utente');
                caricaIscritti(); 
            })
            .catch(errore => alert("❌ " + errore.message));
        }

        // CARICAMENTO DARK MODE
        document.addEventListener("DOMContentLoaded", () => {
            const temaSalvato = localStorage.getItem('tema_bottega');
            if (temaSalvato === 'dark') document.body.classList.add('dark'); 
        });
    </script>
</body>
</html>
