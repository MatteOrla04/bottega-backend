<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Accesso - Bottega Solidale</title>
    
    <link rel="stylesheet" href="style.css?v=11">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        .login-box {
            background-color: var(--card-bg, #ffffff);
            color: var(--text-color, #333333);
            padding: 40px;
            border-radius: 15px;
            box-shadow: var(--shadow, 0 10px 30px rgba(0,0,0,0.2));
            width: 100%;
            max-width: 400px;
            text-align: center;
            z-index: 10; 
        }

        .login-box h2 {
            margin-bottom: 25px;
            color: var(--primary-color, #0056b3);
        }

        .toggle-link {
            display: block;
            margin-top: 20px;
            color: var(--primary-color, #0056b3);
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.95rem;
            font-weight: bold;
        }

        body.dark .login-box h2,
        body.dark .toggle-link {
            color: #4da3ff; 
        }

        #form-registrazione {
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        
        <!-- FACCIA 1: ACCESSO -->
        <div id="form-accesso">
            <h2>🔐 Accesso Operatori</h2>
            
            <div class="form-group" style="text-align: left;">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="Inserisci il tuo username">
            </div>
            
            <div class="form-group" style="text-align: left;">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Inserisci la password">
            </div>
            
            <button id="btn-login" class="btn-conferma" style="margin-top: 15px;" onclick="eseguiLogin()">Entra nella Bottega</button>
            
            <span class="toggle-link" onclick="cambiaSchermata('registrazione')">Nuovo operatore? Registrati qui</span>
        </div>

        <!-- FACCIA 2: REGISTRAZIONE -->
        <div id="form-registrazione">
            <h2>📝 Nuovo Operatore</h2>
            
            <div class="form-group" style="text-align: left;">
                <label>Scegli Username</label>
                <input type="text" id="reg-username" placeholder="Es. mario.rossi">
            </div>
            
            <div class="form-group" style="text-align: left;">
                <label>Scegli Password</label>
                <input type="password" id="reg-password" placeholder="Minimo 6 caratteri">
            </div>
            
            <button id="btn-reg" class="btn-blue" style="width: 100%; padding: 12px; margin-top: 15px; border-radius: 6px; font-size: 16px;" onclick="eseguiRegistrazione()">Registra e Accedi</button>
            
            <span class="toggle-link" onclick="cambiaSchermata('accesso')">Hai già un account? Torna al Login</span>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('tema_bottega') === 'dark') {
                document.body.classList.add('dark');
            }

            // Ascolta il tasto INVIO sui campi del Login
            const inputsLogin = document.querySelectorAll('#form-accesso input');
            inputsLogin.forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        eseguiLogin();
                    }
                });
            });

            // Ascolta il tasto INVIO sui campi della Registrazione
            const inputsReg = document.querySelectorAll('#form-registrazione input');
            inputsReg.forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        eseguiRegistrazione();
                    }
                });
            });
        });

        function cambiaSchermata(modalita) {
            const formAccesso = document.getElementById('form-accesso');
            const formRegistrazione = document.getElementById('form-registrazione');
            
            document.querySelectorAll('input').forEach(input => input.value = '');

            if (modalita === 'registrazione') {
                formAccesso.style.display = 'none';
                formRegistrazione.style.display = 'block';
            } else {
                formRegistrazione.style.display = 'none';
                formAccesso.style.display = 'block';
            }
        }

        function eseguiRegistrazione() {
            const user = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value.trim();
            const btnReg = document.getElementById('btn-reg');

            if (!user || pass.length < 6) {
                alert("Attenzione: Inserisci un username e una password di almeno 6 caratteri!");
                return;
            }

            // Disabilita il bottone ed evita altri click
            btnReg.disabled = true;
            btnReg.style.opacity = "0.6";
            btnReg.style.cursor = "not-allowed";

            const dati = {
                username: user,
                passwordHash: pass
            };

            fetch('/api/auth/registrazione', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dati)
            })
            .then(async response => {
                const messaggio = await response.text();
                if (response.ok) {
                    alert("Registrazione completata! Ora puoi fare l'accesso.");
                    cambiaSchermata('accesso'); 
                } else {
                    alert("Errore: " + messaggio); 
                }
            })
            .catch(error => console.error("Errore di rete:", error))
            .finally(() => {
                // Riattiva il bottone in caso di errore o completamento
                btnReg.disabled = false;
                btnReg.style.opacity = "1";
                btnReg.style.cursor = "pointer";
            });
        }

        function eseguiLogin() {
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            const btnLogin = document.getElementById('btn-login');

            if (!user || !pass) {
                alert("Inserisci username e password!");
                return;
            }

            // Disabilita subito il bottone per impedire doppi click o selezioni
            btnLogin.disabled = true;
            btnLogin.style.opacity = "0.6";
            btnLogin.style.cursor = "not-allowed";

            const dati = {
                username: user,
                passwordHash: pass
            };

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dati)
            })
            .then(async response => {
                if (response.ok) {
                    const datiUtente = await response.json();
                    
                    sessionStorage.setItem("operatoreLoggato", datiUtente.username);
                    sessionStorage.setItem("ruoloOperatore", datiUtente.ruolo); 
                    
                    window.location.href = 'index.html';
                } else {
                    const messaggio = await response.text();
                    alert("Accesso negato: " + messaggio);
                    // Riattiva il bottone se le credenziali sono errate
                    btnLogin.disabled = false;
                    btnLogin.style.opacity = "1";
                    btnLogin.style.cursor = "pointer";
                }
            })
            .catch(error => {
                console.error("Errore di rete:", error);
                btnLogin.disabled = false;
                btnLogin.style.opacity = "1";
                btnLogin.style.cursor = "pointer";
            });
        }
    </script>
</body>
</html>
