<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Magazzino</title>
    
    <!-- IL COLLEGAMENTO MAGICO CON TRUCCO ANTI-MEMORIA (?v=10) -->
    <link rel="stylesheet" href="style.css?v=10">
    
    <style>
        /* Manteniamo solo i bottoni specifici del magazzino che non ci sono nel CSS principale */
        .btn-blue { background-color: var(--primary-color, #007bff); color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-yellow { background-color: #ffc107; color: black; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .modal-actions { display: flex; justify-content: space-between; margin-top: 10px; }
        
        /* Spaziatura specifica per questa pagina */
        body { padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>

    <script>
        // IL BUTTAFUORI: Se non hai il timbro, torni al login!
        if (!sessionStorage.getItem("operatoreLoggato")) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body>

    <div class="header">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">⬅️ Dashboard</div>
        
        <!-- MODIFICA: Raggruppati i bottoni a destra -->
        <div>
            <button class="btn-green" style="padding: 10px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;" onclick="apriModale()">+ Nuovo Prodotto</button>

        </div>
    </div>

    <!-- SEZIONE: TITOLO E BARRA DI RICERCA LIVE -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Gestione Magazzino</h2>
        <div>
            <input type="text" id="input-ricerca-magazzino" placeholder="Cerca codice, descrizione..." onkeyup="filtraProdotti()" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc; width: 300px;">
            <button class="btn-blue" onclick="filtraProdotti()" style="width: auto; padding: 10px 15px; margin-top: 0; margin-left: 10px;">Filtra</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Codice a Barre</th>
                <th>Descrizione</th>
                <th>Costo (Punti)</th>
                <th>Scorta in Magazzino</th>
                <th>Azioni Rapide</th>
            </tr>
        </thead>
        <tbody id="tabella-prodotti">
        </tbody>
    </table>

    <!-- IL BLOCCO DI SICUREZZA INFALLIBILE (style="display: none;") -->
    <div id="modale-prodotto" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modale-titolo" style="margin-bottom: 15px;">Aggiungi Prodotto</h3>
            
            <div class="form-group">
                <input type="text" id="input-barre" placeholder="Codice a Barre (Es. 80012345)" autocomplete="off">
            </div>
            <div class="form-group">
                <input type="text" id="input-descrizione" placeholder="Descrizione (Es. Pasta Barilla)" autocomplete="off">
            </div>
            <div class="form-group">
                <input type="number" id="input-costo" placeholder="Costo in Punti (Es. 5)">
            </div>
            <div class="form-group">
                <input type="number" id="input-scorta" placeholder="Scorta Iniziale (Es. 50)">
            </div>
            
            <div class="modal-actions">
                <button onclick="chiudiModale()" style="background: #ccc; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Annulla</button>
                <button class="btn-blue" onclick="salvaProdotto()">Salva nel DB</button>
            </div>
        </div>
    </div>

    <script>
        // MEMORIA DELLA DARK MODE: Applicata al caricamento
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('tema_bottega') === 'dark') {
                document.body.classList.add('dark');
            }
            caricaInventario();
        });

        // MEMORIA DEL MAGAZZINO
        let listaProdotti = [];

        function caricaInventario() {
            fetch('/api/magazzino/prodotti', { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error("Server non raggiungibile");
                    return response.json();
                })
                .then(prodotti => {
                    listaProdotti = prodotti;
                    disegnaTabella(listaProdotti);
                })
                .catch(errore => {
                    console.error(errore);
                    document.getElementById('tabella-prodotti').innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Impossibile caricare i dati. Il server Java è acceso?</td></tr>`;
                });
        }

        // RICERCA INTELLIGENTE
        function filtraProdotti() {
            const termineRicerca = document.getElementById('input-ricerca-magazzino').value.toLowerCase();
            const risultatiFiltrati = listaProdotti.filter(prodotto => {
                const datiCompleti = Object.values(prodotto).map(val => val ? val.toString().toLowerCase() : "").join(" ");
                return datiCompleti.includes(termineRicerca);
            });
            disegnaTabella(risultatiFiltrati);
        }

        function disegnaTabella(prodottiDaMostrare) {
            const tbody = document.getElementById('tabella-prodotti');
            tbody.innerHTML = ''; 

            prodottiDaMostrare.forEach(p => {
                let tr = document.createElement('tr');
                let coloreScorta = p.scortaMagazzino <= 5 ? '#dc3545' : 'var(--green-accent)';

                tr.innerHTML = `
                    <td><strong>${p.codiceBarre}</strong></td>
                    <td>${p.descrizione}</td>
                    <td>${p.puntiCosto}</td>
                    <td style="color: ${coloreScorta}; font-weight: bold;">${p.scortaMagazzino}</td>
                    <td><button class="btn-yellow" onclick="aggiungiScorta('${p.codiceBarre}')">+ Carico</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function apriModale() {
            document.getElementById('input-barre').value = '';
            document.getElementById('input-descrizione').value = '';
            document.getElementById('input-costo').value = '';
            document.getElementById('input-scorta').value = '';
            document.getElementById('modale-prodotto').style.display = 'block';
            
            setTimeout(() => document.getElementById('input-barre').focus(), 100);
        }

        function chiudiModale() {
            document.getElementById('modale-prodotto').style.display = 'none';
        }

        function salvaProdotto() {
            const nuovoProdotto = {
                codiceBarre: document.getElementById('input-barre').value.trim(),
                descrizione: document.getElementById('input-descrizione').value.trim(),
                puntiCosto: parseInt(document.getElementById('input-costo').value),
                scortaMagazzino: parseInt(document.getElementById('input-scorta').value)
            };

            if (!nuovoProdotto.codiceBarre || !nuovoProdotto.descrizione || isNaN(nuovoProdotto.puntiCosto) || isNaN(nuovoProdotto.scortaMagazzino)) {
                alert("Compila tutti i campi correttamente!");
                return;
            }

            // 1. RECUPERIAMO IL NOME DELL'OPERATORE LOGGATO
            const operatoreAttuale = sessionStorage.getItem("operatoreLoggato");

            fetch('/api/magazzino/prodotto', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Operatore': operatoreAttuale // 2. INSERIAMO LA FIRMA NELL'HEADER!
                },
                body: JSON.stringify(nuovoProdotto)
            })
            .then(response => {
                if (response.ok) {
                    alert("Prodotto salvato con successo!");
                    chiudiModale();
                    caricaInventario(); 
                    document.getElementById('input-ricerca-magazzino').value = ''; 
                } else {
                    alert("Errore durante il salvataggio.");
                }
            });
        }

        function aggiungiScorta(codiceBarre) {
            let quantitaDaAggiungere = prompt("Quanti pezzi sono arrivati per il prodotto " + codiceBarre + "?");
            
            if (quantitaDaAggiungere && !isNaN(quantitaDaAggiungere) && parseInt(quantitaDaAggiungere) > 0) {
                
                // 1. RECUPERIAMO IL NOME DELL'OPERATORE ANCHE QUI
                const operatoreAttuale = sessionStorage.getItem("operatoreLoggato");

                fetch('/api/magazzino/prodotto/scorta?barre=' + codiceBarre + '&qta=' + quantitaDaAggiungere, {
                    method: 'PUT',
                    headers: {
                        'Operatore': operatoreAttuale // 2. FIRMIAMO ANCHE IL CARICO MERCE!
                    }
                })
                .then(response => {
                    if (response.ok) {
                        caricaInventario(); 
                        document.getElementById('input-ricerca-magazzino').value = ''; 
                    } else {
                        alert("Errore nell'aggiornamento della scorta.");
                    }
                });
            }
        }

        document.getElementById('input-barre').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                document.getElementById('input-descrizione').focus(); 
            }
        });

        // MODIFICA: Funzione per il Logout
        function eseguiLogout() {
            sessionStorage.removeItem("operatoreLoggato");
            sessionStorage.removeItem("ruoloOperatore"); // Ci servirà per l'Admin!
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
