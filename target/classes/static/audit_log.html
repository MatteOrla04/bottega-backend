<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registro Attività - Admin</title>
    <link rel="stylesheet" href="style.css?v=99">
    <style>
        body { padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: var(--card-bg, #fff); }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #17a2b8; color: white; }
        
        /* Adattamenti Dark Mode per la tabella */
        body.dark table { color: white; border-color: #444; }
        body.dark th, body.dark td { border-color: #555; }
    </style>

    <script>
        // DOPPIO BUTTAFUORI: Devi essere loggato E devi essere ADMIN!
        const ruolo = sessionStorage.getItem("ruoloOperatore");
        if (!sessionStorage.getItem("operatoreLoggato") || ruolo !== 'ADMIN') {
            alert("ACCESSO NEGATO: Area riservata agli Amministratori.");
            window.location.href = "index.html"; // Ti rispedisce alla dashboard
        }
    </script>
</head>
<body>

    <div class="header">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">⬅️ Dashboard</div>
        <h2>Registro Attività di Sistema 🛡️</h2>
        <button style="padding: 10px; background-color: #dc3545; color: white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;" onclick="eseguiLogout()">Esci 🚪</button>
    </div>

    <!-- Barra di ricerca rapida -->
    <div style="margin-bottom: 15px;">
        <input type="text" id="ricerca-log" placeholder="Cerca per operatore, azione..." onkeyup="filtraLog()" style="padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc;">
    </div>

    <table>
        <thead>
            <tr>
                <th>Data e Ora</th>
                <th>Operatore</th>
                <th>Tipo Azione</th>
                <th>Dettagli Operazione</th>
            </tr>
        </thead>
        <tbody id="tabella-log">
            <tr><td colspan="4" style="text-align: center;">Caricamento registri in corso...</td></tr>
        </tbody>
    </table>

    <script>
        // MEMORIA DARK MODE
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('tema_bottega') === 'dark') {
                document.body.classList.add('dark');
            }
            caricaLog();
        });

        let tuttiIlog = [];

        // SCARICA I LOG DA JAVA
        function caricaLog() {
            fetch('/api/audit/logs')
                .then(response => {
                    if (!response.ok) throw new Error("Errore di rete");
                    return response.json();
                })
                .then(dati => {
                    // Ordiniamo i log in modo che i più recenti siano in alto!
                    tuttiIlog = dati.reverse();
                    disegnaTabella(tuttiIlog);
                })
                .catch(err => {
                    document.getElementById('tabella-log').innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Errore nel caricamento del registro.</td></tr>`;
                });
        }

        // DISEGNA LA TABELLA
        function disegnaTabella(lista) {
            const tbody = document.getElementById('tabella-log');
            tbody.innerHTML = '';
            
            if(lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nessuna attività registrata.</td></tr>';
                return;
            }

            lista.forEach(log => {
                let tr = document.createElement('tr');
                
                // Formattiamo la data per renderla leggibile (es: 24/05/2026 14:30)
                let dataFormattata = new Date(log.dataOra).toLocaleString('it-IT');

                tr.innerHTML = `
                    <td style="font-size: 0.9em; color: gray;">${dataFormattata}</td>
                    <td style="font-weight: bold; color: var(--primary-color);">👨‍💻 ${log.operatore ? log.operatore.username : 'Sconosciuto'}</td>
                    <td><span style="background-color: #eee; padding: 3px 8px; border-radius: 10px; font-size: 0.8em; color: black;">${log.azione}</span></td>
                    <td>${log.dettagli}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // RICERCA LIVE DEI LOG
        function filtraLog() {
            const termine = document.getElementById('ricerca-log').value.toLowerCase();
            const filtrati = tuttiIlog.filter(log => {
                const testo = `${log.operatore ? log.operatore.username : ''} ${log.azione} ${log.dettagli}`.toLowerCase();
                return testo.includes(termine);
            });
            disegnaTabella(filtrati);
        }

        function eseguiLogout() {
            sessionStorage.removeItem("operatoreLoggato");
            sessionStorage.removeItem("ruoloOperatore");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
